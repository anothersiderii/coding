<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ri website</title>
    <style>
        body {
            background-color: #6ca7ff;
            font-family: 'Segoe UI', Tahoma, Verdana, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        
        .card {
            background-color: #fafafa;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #242424;
            margin-bottom: 15px;
        }

        p {
            color: #555555;
            font-size: 17px;
            margin-bottom: 30px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 13px 26px;
            font-size: 16px;
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h1>Color Changer.</h1>
        <p>Click the button below to change the background color of the page.</p>
        <button id="changecolorBtn">Change Color</button>
    </div>

    <script>
        const button = document.getElementById('changecolorBtn');
        const body = document.body;

      function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

    button.addEventListener('click', () => {
        const newColor = getRandomColor();
        body.style.backgroundColor = newColor;
    });
    </script>
</body>
</html>
